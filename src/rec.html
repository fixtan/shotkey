<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>shotkey 録画中</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1f; color: #eee; font: 13px "Segoe UI", "Yu Gothic UI", sans-serif; user-select: none; }
  #bar { box-sizing: border-box; height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border: 1px solid #444; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #e53935; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #rec { font-weight: 700; color: #ff6b66; letter-spacing: .05em; }
  #time { font-variant-numeric: tabular-nums; flex: 1; }
  button { font: inherit; background: #e53935; color: #fff; border: 0; border-radius: 3px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: #ff5a55; }
</style>
</head>
<body>
<div id="bar" data-tauri-drag-region>
  <span id="dot" data-tauri-drag-region></span>
  <span id="rec" data-tauri-drag-region>REC</span>
  <span id="time" data-tauri-drag-region>00:00</span>
  <button id="stop" title="録画を止めて保存">■ 停止</button>
</div>
<script>
  const { invoke } = window.__TAURI__.core;
  const limit = Number(new URLSearchParams(location.search).get('limit')) || 0;
  const t0 = Date.now();
  const f = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  function tick() {
    const s = Math.floor((Date.now() - t0) / 1000);
    document.getElementById('time').textContent = limit ? `${f(s)} / ${f(limit)}` : f(s);
  }
  tick();
  setInterval(tick, 250);
  document.getElementById('stop').addEventListener('click', () => invoke('stop_rec'));
</script>
</body>
</html>
