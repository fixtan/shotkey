<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>shotkey overlay</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
      canvas { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; }
      #label { position: absolute; padding: 2px 8px; background: rgba(0,0,0,.8); color: #fff; font: 12px/1.6 Consolas, monospace; border-radius: 3px; pointer-events: none; display: none; white-space: nowrap; }
      #hint { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); padding: 4px 12px; background: rgba(0,0,0,.7); color: #ddd; font: 12px "Segoe UI","Yu Gothic UI",sans-serif; border-radius: 4px; pointer-events: none; }
    </style>
    <script type="module" src="overlay.js" defer></script>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <canvas id="ui"></canvas>
    <div id="label"></div>
    <div id="hint">ドラッグで範囲を選択 ／ Esc または右クリックでキャンセル</div>
  </body>
</html>
